name: Deploy to GitHub Pages

# Production deploy for jacquelinesurdell.com. Triggered by the "Publish site"
# button in Pages CMS, or manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      # Sent by the Pages CMS action button. Unused, but the dispatch is
      # rejected if the workflow does not declare the input it receives.
      payload:
        description: Context sent by Pages CMS
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://jacquelinesurdell.com
      - name: Restore optimized image cache
        uses: actions/cache@v4
        with:
          path: .image-cache
          key: optimized-images-${{ github.sha }}
          restore-keys: optimized-images-
      - name: Optimize images for the web
        run: npm run optimize:images
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
